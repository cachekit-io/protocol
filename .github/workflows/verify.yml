name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-vectors:
    name: Test vectors match reference implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Python reference verify (stdlib)
        run: python3 tools/interop-reference.py verify

      - name: Python reference verify (AES-GCM seal, cryptography)
        run: |
          pip install cryptography
          python3 tools/interop-reference.py verify

      - name: JS cross-check (independent encoder + @noble/hashes + WebCrypto)
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund @noble/hashes
          node tools/interop-crosscheck.mjs
