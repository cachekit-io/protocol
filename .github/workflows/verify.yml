name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-vectors:
    name: Test vectors match reference implementations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Python reference verify (stdlib only)
        run: |
          # Mutation suite first, same doctrine as the version-floor guard below:
          # prove the fail-closed guards still fail before trusting the verify.
          python3 tools/test_wire_format_reference.py
          python3 tools/test_decode_bounds_reference.py
          python3 tools/test_interop_v2_reference.py
          python3 tools/interop-reference.py verify
          python3 tools/interop-v2-reference.py verify
          python3 tools/test_encryption_verify.py
          python3 tools/encryption-verify.py
          python3 tools/wire-format-reference.py verify
          python3 tools/decode-bounds-reference.py verify

      # xxhash: the only place the ByteStorage checksums, including the constructed
      # vector's, are recomputed in this repo. The stdlib leg takes them on trust.
      - name: Python reference verify (optional deps — AES-GCM seal + msgpack third-encoder + lz4 C-implementation + xxHash3-64 conformance)
        run: |
          pip install cryptography==49.0.0 msgpack==1.2.1 lz4==4.4.5 xxhash==4.0.1
          python3 tools/interop-reference.py verify
          python3 tools/interop-v2-reference.py verify
          python3 tools/test_encryption_verify.py
          python3 tools/encryption-verify.py --require-seal
          python3 tools/test_wire_format_reference.py
          python3 tools/wire-format-reference.py verify --require-extras
          python3 tools/decode-bounds-reference.py verify --require-extras

      - name: JS cross-check (independent encoder + @noble/hashes + WebCrypto)
        run: |
          npm init -y >/dev/null
          npm install --no-audit --no-fund --ignore-scripts @noble/hashes@2.2.0
          node tools/interop-crosscheck.mjs

      - name: Interop v2 JS cross-check (zero-dep independent container parser + LZ4 decoder + WebCrypto)
        run: |
          node tools/test-interop-v2-crosscheck-guard.mjs
          node tools/interop-v2-crosscheck.mjs

      - name: Python-frame verify (stdlib only)
        run: |
          python3 tools/test_python_frame_reference.py
          python3 tools/python-frame-reference.py verify

      - name: File-backend format verify (stdlib only)
        run: python3 tools/file-backend-reference.py

      - name: Cache-key path-encoding verify (stdlib only; mutation self-test first)
        run: python3 tools/path-encoding-verify.py

      - name: SaaS freshness-header verify (stdlib only; with a mutation self-test)
        run: python3 tools/freshness-headers-verify.py

      # LAB-1202: the mutation suite runs first so the lz4 allocation guard
      # cannot silently degrade to reporting OK (same rule as the version-floors
      # suite below).
      - name: Python-frame JS cross-check (zero-dep independent reader, full round-trip)
        run: |
          node tools/test-frame-crosscheck-guard.mjs
          node tools/frame-crosscheck.mjs

      # The >=64-bit ratio-product rule is stated in full in BOTH spec documents
      # (an implementer reads one standalone), so the copies are guarded rather
      # than trusted -- divergent normative text for this exact bound is the bug
      # LAB-2594 closed. Mutation suite first, same doctrine as below.
      - name: Ratio-product rule identical in both spec documents
        run: |
          python3 tools/test_check_spec_duplication.py
          python3 tools/check-spec-duplication.py

      # Narrow on purpose: catches one facet of ONE of the six matrix incidents
      # listed in decisions/matrix-version-verification.md — a version in the SDK
      # Overview table stated as a snapshot, true when written and false at the
      # next release. The other five need a reader, not a regex. The mutation
      # suite runs first so the guard cannot degrade to silently reporting OK.
      - name: SDK Overview versions are floors, not snapshots
        run: |
          python3 tools/test_check_version_floors.py
          python3 tools/check-version-floors.py

      # Includes a dry run of the next release against the real CHANGELOG.md and
      # changelog.d/, so a fragment or marker that would break it fails here first.
      - name: Changelog collect (stdlib only)
        run: python3 tools/test_changelog_collect.py

  # Every MUST and MUST NOT in an indexed spec file carries an id that
  # conformance/requirements.json maps to vectors, tests or a recorded gap, and
  # conformance/coverage.md is generated from it. Full history: each SDK's vendored
  # fixture copy is matched to a revision of its fixture, and `--base` catches an id
  # dropped instead of retired. The base is the commit before the push on main, and the
  # first parent of GitHub's test merge (the base tip) on a pull request. Mutation suite
  # first, same doctrine as the guards above.
  conformance:
    name: Every MUST has an id, a mapping and a current coverage report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Conformance index (stdlib only; mutation suite first)
        env:
          BASE: ${{ github.event_name == 'push' && github.event.before || 'HEAD^1' }}
        run: |
          python3 tools/test_conformance.py
          python3 tools/conformance.py check --base "$BASE"

  # Every PR that added its entry under the shared `## [Unreleased]` heading
  # conflicted with every other open PR that did the same. Entries go in
  # changelog.d/ (one file each); only a release/* branch rewrites CHANGELOG.md.
  changelog-fragments:
    name: CHANGELOG.md is edited only by releases
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Changelog entries are fragments in changelog.d/
        run: |
          # HEAD is GitHub's test merge of the PR into its base, so HEAD^1 is the base tip.
          if ! git diff --quiet HEAD^1 HEAD -- CHANGELOG.md; then
            echo "::error file=CHANGELOG.md::Put the entry in a new file under changelog.d/ instead (see changelog.d/README.md). CHANGELOG.md changes only on a release/* branch."
            exit 1
          fi
